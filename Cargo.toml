[package]
name = "lanes-wm"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-graphics = "0.25"
core-foundation = { version = "0.10", features = ["with-uuid"] }
core-foundation-sys = "0.8"
uuid = "1"
accessibility-sys = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
regex = "1"
log = "0.4"
env_logger = "0.11"
